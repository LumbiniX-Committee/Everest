name: Bug
description: Something in the app or the site behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Tīrtha (map, sites, quests)
        - Sākṣī (vantage, alignment, capture, reports)
        - Dhamma (questions and answers)
        - Onboarding or settings
        - Custodian dashboard
        - The website
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and build
      description: >
        Phone model, Android version, and the app version from Settings → About.
        The camera, GPS, compass, map and damage detector behave differently in a
        simulator, so this matters more than it usually does.
      placeholder: Pixel 6a, Android 14, 0.1.0 (build 1)
